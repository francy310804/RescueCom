services:
  client1:
    build:
      context: app
    networks:
      net:
        ipv4_address:
          10.10.0.1

  client2:
    build:
      context: app
    networks:
      net:
        ipv4_address:
          10.10.0.2

  client3:
    build:
      context: app
    networks:
      net:
        ipv4_address:
          10.10.0.3

networks:
  net:
    name:
      test-network
    enable_ipv6:
      true
    ipam:
      driver: bridge
      config:
        - subnet: 10.10.0.0/16
          ip_range: 10.10.0.0/16
          gateway: 10.10.255.254
